<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Mamidi | Art in Every Stroke</title>
    <meta
      name="description"
      content="Mamidi crafts artful calendars and collectibles. Browse the catalog, place custom orders, and track studio sales from one dashboard."
    />
    <link rel="canonical" href="https://mamidi.in/" />

    <!-- Favicon / social preview -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Mamidi | Art in Every Stroke" />
    <meta
      property="og:description"
      content="Discover Mamidi's handcrafted calendars and creations. Explore the catalog and manage orders seamlessly."
    />
    <meta property="og:image" content="/mamidi_profile.jpeg" />
    <meta property="og:url" content="https://mamidi.in/" />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mamidi | Art in Every Stroke" />
    <meta
      name="twitter:description"
      content="Discover Mamidi's handcrafted calendars and creations."
    />
    <meta name="twitter:image" content="/mamidi_profile.jpeg" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-image-preview:large" />

    <!-- Brand / locale / geo -->
    <meta name="author" content="Mamidi" />
    <meta name="theme-color" content="#1A2C08" />
    <meta name="keywords" content="Madhubani art, Mithila painting, hand-painted calendars, Indian folk art, handmade keepsakes, eco-friendly gifts, Mamidi" />
    <meta name="geo.region" content="IN" />
    <meta name="geo.placename" content="India" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:site_name" content="Mamidi" />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Mamidi",
      "url": "https://mamidi.in/",
      "logo": "https://mamidi.in/mamidi_profile.jpeg",
      "image": "https://mamidi.in/mamidi_profile.jpeg",
      "description": "Mamidi creates hand-painted Madhubani (Mithila) folk-art calendars, keepsakes and gifts, crafted in India.",
      "email": "mamidi.artstore@gmail.com",
      "areaServed": "IN",
      "address": { "@type": "PostalAddress", "addressCountry": "IN" },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-98858-66281",
        "contactType": "customer service",
        "areaServed": "IN",
        "availableLanguage": ["en", "hi"]
      },
      "sameAs": ["https://www.instagram.com/mamidi___"]
    }
    </script>

    <!-- Structured data: WebSite + search action -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Mamidi",
      "url": "https://mamidi.in/",
      "inLanguage": "en-IN",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://mamidi.in/shop?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
